<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;background:#1b1b1b;color:#fff;font:15px/1.45 var(--font);-webkit-font-smoothing:none}
.top{flex:none;display:flex;align-items:center;gap:32px;height:72px;padding:0 20px;background:linear-gradient(rgba(18,18,18,.8),rgba(18,18,18,.8)),var(--stone) 0 0/64px;image-rendering:pixelated;border-bottom:4px solid #000;box-shadow:inset 0 -2px 0 #4a4a4a}
.top>*{image-rendering:auto}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:22px;text-shadow:3px 3px 0 #3f3f3f;white-space:nowrap}
.brand svg{width:32px;height:32px;image-rendering:pixelated;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.5))}
#bar{display:flex;gap:18px;align-items:center}
#bar button{display:flex;align-items:center;gap:10px;height:44px;padding:0 18px 0 10px;background:#3a3a3a;border:2px solid #000;box-shadow:inset 2px 2px 0 #6a6a6a,inset -2px -2px 0 #232323;color:#cfcfcf;font:600 17px var(--font);cursor:pointer;text-shadow:2px 2px 0 #3f3f3f;white-space:nowrap}
#bar button svg{width:26px;height:26px;image-rendering:pixelated}
#bar button:hover{color:#ffff55}
#bar button.on{color:#fff;box-shadow:inset 2px 2px 0 #6a6a6a,inset -2px -2px 0 #232323,0 0 0 2px #000,0 0 0 5px #f0f0f0,0 0 0 7px #000}
#bar button:focus-visible{outline:2px solid #ffff55;outline-offset:6px}
.note{margin-left:auto;padding:6px 12px;background:rgba(16,0,16,.94);border:2px solid;border-color:#5a1fd6 #28007f #28007f #5a1fd6;color:#fff;font-size:14px;white-space:nowrap}
.ground{flex:none;height:16px;background:var(--side) 0 0/32px 32px;image-rendering:pixelated;border-bottom:2px solid #000}
iframe{display:none;flex:1;min-height:0;width:100%;border:0;background:#1b1b1b}
iframe.on{display:block}
@media (max-width:820px){.top{gap:10px;padding:0 10px}.brand span,.note{display:none}#bar{flex:1;min-width:0;gap:12px}#bar button{flex:1;padding:0 8px;font-size:14px;gap:6px;justify-content:center}#bar button svg{width:20px;height:20px}}
</style>
</head>

<script type="text/plain" id="mctex">

 width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"4\" y=\"7\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"5\" y=\"7\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"6\" y=\"7\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"7\" y=\"7\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"8\" y=\"7\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"9\" y=\"7\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"10\" y=\"7\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"11\" y=\"7\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"0\" y=\"8\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"1\" y=\"8\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"2\" y=\"8\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"3\" y=\"8\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"4\" y=\"8\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"5\" y=\"8\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"6\" y=\"8\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"7\" y=\"8\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"8\" y=\"8\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"9\" y=\"8\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"10\" y=\"8\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"11\" y=\"8\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"0\" y=\"9\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"1\" y=\"9\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"2\" y=\"9\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"3\" y=\"9\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"4\" y=\"9\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"5\" y=\"9\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"6\" y=\"9\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"7\" y=\"9\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"8\" y=\"9\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"9\" y=\"9\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"10\" y=\"9\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"11\" y=\"9\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"0\" y=\"10\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"1\" y=\"10\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"2\" y=\"10\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"3\" y=\"10\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"4\" y=\"10\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"5\" y=\"10\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"6\" y=\"10\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"7\" y=\"10\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"8\" y=\"10\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"9\" y=\"10\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"10\" y=\"10\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"11\" y=\"10\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"0\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"1\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"2\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"3\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"4\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"5\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"6\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"7\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"8\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"9\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"10\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"11\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><\/svg><\/span><span><strong>Drop an image or browse<\/strong><span class=\"sub\">PNG, JPG, GIF or WebP. No size limit.<\/span><span class=\"drop-name\"><\/span><\/span><input type=\"file\" id=\"file\" accept=\"image/*\"><\/label>\n    <div class=\"grid2\">\n      <div class=\"field\"><label for=\"w\">Width (blocks)<\/label><input type=\"number\" id=\"w\" min=\"1\" max=\"16384\" value=\"128\"><\/div>\n      <div class=\"field\"><label for=\"h\">Height (blocks)<\/label><input type=\"number\" id=\"h\" min=\"1\" max=\"16384\" value=\"128\"><\/div>\n    <\/div>\n    <label class=\"chk\"><input type=\"checkbox\" id=\"lock\" checked> Keep aspect ratio<\/label>\n  <\/div><\/section>\n\n  <section class=\"step\"><h2><span class=\"n\">2<\/span>Blocks<\/h2>\n  <div class=\"stack\">\n    <div class=\"field\"><label for=\"palette\">Palette<\/label>\n      <select id=\"palette\">\n        <option value=\"everything\">Everything (all 144 blocks, including rare and storage blocks)<\/option>\n        <option value=\"survival\">Survival-friendly (no diamond, netherite and similar blocks)<\/option>\n        <option value=\"natural\">Natural tones (stone, wood, earth, terracotta)<\/option>\n        <option value=\"all\">Colors only (wool, concrete, terracotta)<\/option>\n        <option value=\"stone\">Stone, bricks and deepslate<\/option>\n        <option value=\"wood\">Planks<\/option>\n        <option value=\"mineral\">Metal and mineral blocks<\/option>\n        <option value=\"wool\">Wool<\/option>\n        <option value=\"concrete\">Concrete<\/option>\n        <option value=\"terracotta\">Terracotta<\/option>\n        <option value=\"wc\">Wool and concrete<\/option>\n        <option value=\"ct\">Concrete and terracotta<\/option>\n      <\/select><\/div>\n    <div class=\"field\"><label for=\"maxb\">Maximum block types<\/label><input type=\"number\" id=\"maxb\" min=\"0\" value=\"0\"><span class=\"hint\">0 means no limit. Rare blocks merge into the closest block still in use.<\/span><\/div>\n  <\/div>\n  <details class=\"more\">\n  <summary>Block palette <small>Choose individual blocks<\/small><\/summary>\n  <div class=\"inner\">\n    <p class=\"hint\" style=\"margin:0\">Click a block to leave it out. Excluded blocks are replaced by the closest block that remains.<\/p>\n    <div class=\"pal-tools\"><input type=\"text\" id=\"bsearch\" placeholder=\"Search blocks\" aria-label=\"Search blocks\"><button class=\"btn sm\" id=\"resetEx\">Re-enable all<\/button><\/div>\n    <div id=\"picker\"><\/div>\n    <div id=\"subs\" class=\"hint\"><\/div>\n  <\/div>\n<\/details><\/section>\n\n  <section class=\"step\"><h2><span class=\"n\">3<\/span>Appearance<\/h2>\n  <div class=\"stack\">\n    <div class=\"field\"><div class=\"lbl\"><label for=\"bright\">Brightness<\/label><output><span id=\"bv\">0<\/span><\/output><\/div><input type=\"range\" id=\"bright\" min=\"-100\" max=\"100\" value=\"0\"><\/div>\n    <div class=\"field\"><div class=\"lbl\"><label for=\"sat\">Saturation<\/label><output><span id=\"sv\">0<\/span><\/output><\/div><input type=\"range\" id=\"sat\" min=\"-100\" max=\"100\" value=\"0\"><\/div>\n    <div class=\"field\"><div class=\"lbl\"><label for=\"con\">Contrast<\/label><output><span id=\"cv\">0<\/span><\/output><\/div><input type=\"range\" id=\"con\" min=\"-100\" max=\"100\" value=\"0\"><\/div>\n    <div class=\"grid2\">\n      <div class=\"field\"><label for=\"rs\">Resizing<\/label><select id=\"rs\"><option value=\"smooth\">Smooth (photos)<\/option><option value=\"sharp\">Sharp (pixel art, logos)<\/option><\/select><\/div>\n      <div class=\"field\"><div class=\"lbl\"><label for=\"sharp\">Sharpen<\/label><output><span id=\"shv\">0<\/span>%<\/output><\/div><input type=\"range\" id=\"sharp\" min=\"0\" max=\"100\" value=\"0\"><\/div>\n    <\/div>\n    <div class=\"field\"><label for=\"dmode\">Dithering<\/label><select id=\"dmode\"><option value=\"none\">Off (flat, clean areas)<\/option><option value=\"fs\">Floyd-Steinberg (smooth gradients)<\/option><option value=\"bayer\">Ordered (pixel-art look)<\/option><\/select><\/div>\n    <div class=\"field\"><div class=\"lbl\"><label for=\"dstr\">Dither strength<\/label><output><span id=\"dsv\">80<\/span>%<\/output><\/div><input type=\"range\" id=\"dstr\" min=\"10\" max=\"100\" value=\"80\"><\/div>\n    <div class=\"field\"><label for=\"dist\">Color matching<\/label><select id=\"dist\"><option value=\"de00\">Best quality (CIEDE2000)<\/option><option value=\"fast\">Faster (Lab)<\/option><\/select><\/div>\n    <label class=\"chk\"><input type=\"checkbox\" id=\"transp\" checked><span>Leave transparent pixels empty<small>No blocks are placed where the image is transparent.<\/small><\/span><\/label>\n  <\/div><\/section>\n\n  <section class=\"step\"><h2><span class=\"n\">4<\/span>Export<\/h2>\n  <div class=\"stack\">\n    <div class=\"grid2\">\n      <div class=\"field\"><label for=\"fmt\">Format<\/label><select id=\"fmt\"><option value=\"schem\">.schem (Axiom, WorldEdit)<\/option><option value=\"litematic\">.litematic (Litematica)<\/option><\/select><\/div>\n      <div class=\"field\"><label for=\"orient\">Placement<\/label><select id=\"orient\"><option value=\"wall\">Wall (vertical)<\/option><option value=\"floor\">Floor (flat)<\/option><\/select><\/div>\n    <\/div>\n  <\/div>\n  <details class=\"more\">\n    <summary>Advanced options<\/summary>\n    <div class=\"inner\">\n      <div class=\"field\"><label for=\"tile\">Split into tiles (blocks per tile)<\/label><input type=\"number\" id=\"tile\" min=\"0\" value=\"0\"><span class=\"hint\">0 exports a single file.<\/span><\/div>\n      <div class=\"field\"><label for=\"excl\">Exclude blocks by name<\/label><input type=\"text\" id=\"excl\" placeholder=\"sponge, glowstone, copper\"><span class=\"hint\">Separate words with commas.<\/span><\/div>\n      <div class=\"grid2\">\n        <div class=\"field\"><label for=\"acut\">Alpha cutoff<\/label><input type=\"number\" id=\"acut\" min=\"1\" max=\"255\" value=\"128\"><\/div>\n        <div class=\"field\"><label for=\"bg\">Background color<\/label><input type=\"text\" id=\"bg\" value=\"#ffffff\"><\/div>\n      <\/div>\n      <span class=\"hint\" style=\"margin-top:-6px\">Pixels below the alpha cutoff become air. The background color applies only when \" y=\"9\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"3\" y=\"9\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"4\" y=\"9\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"5\" y=\"9\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"6\" y=\"9\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"7\" y=\"9\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"8\" y=\"9\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"9\" y=\"9\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"10\" y=\"9\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"11\" y=\"9\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"0\" y=\"10\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"1\" y=\"10\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"2\" y=\"10\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"3\" y=\"10\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"4\" y=\"10\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"5\" y=\"10\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"6\" y=\"10\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"7\" y=\"10\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"8\" y=\"10\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"9\" y=\"10\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"10\" y=\"10\" width=\"1\" height=\"1\" fill=\"#9a6b32\"/><rect x=\"11\" y=\"10\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"0\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"1\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"2\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"3\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"4\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"5\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"6\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"7\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"8\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"9\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"10\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><rect x=\"11\" y=\"11\" width=\"1\" height=\"1\" fill=\"#3b2410\"/><\/svg><\/span><span><strong>Drop models or browse<\/strong><span class=\"sub\">Pick several .glb, .gltf or .obj files at once, or add more later. For .obj, select its .mtl and textures too.<\/span><span class=\"drop-name\"><\/span><\/span><input type=\"file\" id=\"files\" multiple accept=\".glb,.gltf,.obj,.mtl,.png,.jpg,.jpeg,.webp,.bin\"><\/label>\n  <\/div>\n  <div id=\"info\">No models loaded.<\/div><div id=\"mtools\" class=\"btns2\" style=\"display:none;margin-top:10px\"><button class=\"btn sm\" id=\"arrange\" type=\"button\">Arrange in a row<\/button><button class=\"btn sm\" id=\"clearall\" type=\"button\">Remove all<\/button><\/div><div id=\"mlist\"><\/div><\/section>\n\n  <section class=\"step\"><h2><span class=\"n\">2<\/span>Size and orientation<\/h2>\n  <div class=\"stack\">\n    <div class=\"grid2\">\n      <div class=\"field\"><label for=\"size\">Scene size (blocks)<\/label><input type=\"number\" id=\"size\" min=\"1\" max=\"1500\" value=\"100\"><\/div>\n      <div class=\"field\"><label for=\"axis\">Size applies to<\/label><select id=\"axis\"><option value=\"1\">Height<\/option><option value=\"0\">Width<\/option><option value=\"2\">Depth<\/option><\/select><\/div>\n    <\/div>\n  <\/div><\/section>\n\n  <section class=\"step\"><h2><span class=\"n\">3<\/span>Blocks and color<\/h2>\n  <div class=\"stack\">\n    <div class=\"field\"><label for=\"palette\">Palette<\/label>\n      <select id=\"palette\">\n        <option value=\"all\">Everything (colors and natural blocks)<\/option>\n        <option value=\"colors\">Wool, concrete, terracotta<\/option>\n        <option value=\"concrete\">Concrete<\/option>\n        <option value=\"wool\">Wool<\/option>\n        <option value=\"terracotta\">Terracotta<\/option>\n        <option value=\"extra\">Natural and building blocks<\/option>\n      <\/select><\/div>\n    <div class=\"field\"><label for=\"maxb\">Limit to the best N blocks<\/label><input type=\"number\" id=\"maxb\" min=\"0\" max=\"100\" value=\"24\"><span class=\"hint\">Picks the blocks that suit this model. Fewer blocks make a cleaner, easier build. 0 means no limit.<\/span><\/div>\n    <div class=\"field\"><div class=\"lbl\"><label for=\"bright\">Brightness<\/label><output><span id=\"bv\">0<\/span><\/output><\/div><input type=\"range\" id=\"bright\" min=\"-100\" max=\"100\" value=\"0\"><\/div>\n    <div class=\"field\"><div class=\"lbl\"><label for=\"sat\">Saturation<\/label><output><span id=\"sv\">0<\/span><\/output><\/div><input type=\"range\" id=\"sat\" min=\"-100\" max=\"100\" value=\"0\"><\/div>\n    <div class=\"field\"><div class=\"lbl\"><label for=\"con\">Contrast<\/label><output><span id=\"cv\">0<\/span><\/output><\/div><input type=\"range\" id=\"con\" min=\"-100\" max=\"100\" value=\"0\"><\/div>\n    <div class=\"field\"><div class=\"field\"><div class=\"lbl\"><label for=\"dither\">Dithering<\/label><output><span id=\"dthv\">80<\/span>%<\/output><\/div><input type=\"range\" id=\"dither\" min=\"0\" max=\"100\" value=\"80\"><\/div><span class=\"hint\">0 gives hard color patches. Higher values blend shading into smoother gradients.<\/span><\/div>\n    <div class=\"grid2\">\n      <div class=\"field\"><label for=\"smooth\">Smooth colors first<\/label><select id=\"smooth\"><option value=\"0\">Off<\/option><option value=\"1\">Light<\/option><option value=\"2\">Medium<\/option><option value=\"3\">Strong<\/option><\/select><\/div>\n      <div class=\"field\"><label for=\"dist\">Color matching<\/label><select id=\"dist\"><option value=\"de00\">Best quality<\/option><option value=\"fast\">Faster<\/option><\/select><\/div>\n    <\/div>\n    <span class=\"hint\" style=\"margin-top:-6px\">Smoothing removes speckle but keeps edges such as eyes and outlines.<\/span>\n  <\/div>\n  <details class=\"more\">\n  <summary>Block palette <small>Choose individual blocks<\/small><\/summary>\n  <div class=\"inner\">\n    <p class=\"hint\" style=\"margin:0\">Click a block to leave it out. Excluded blocks are replaced by the closest block that remains.<\/p>\n    <div class=\"pal-tools\"><input type=\"text\" id=\"bsearch\" placeholder=\"Search blocks\" aria-label=\"Search blocks\"><button class=\"btn sm\" id=\"resetEx\">Re-enable all<\/button><\/div>\n    <div id=\"picker\"><\/div>\n    <div id=\"subs\" class=\"hint\"><\/div>\n  <\/div>\n<\/details><\/section>\n\n  <section class=\"step\"><h2><span class=\"n\">4<\/span>Export<\/h2>\n  <div class=\"stack\">\n    <div class=\"grid2\">\n      <div class=\"field\"><label for=\"fmt\">Format<\/label><select id=\"fmt\"><option value=\"schem\">.schem (Axiom, WorldEdit)<\/option><option value=\"litematic\">.litematic (Litematica)<\/option><\/select><\/div>\n      <div class=\"field\"><label for=\"tile\">Split into tiles<\/label><input type=\"number\" id=\"tile\" min=\"0\" value=\"0\"><\/div>\n    <\/div>\n    <span class=\"hint\" style=\"margin-top:-6px\">Tiles are measured in blocks. 0 exports a single file.<\/span>\n  <\/div>\n  <details class=\"more\">\n    <summary>Advanced options<\/summary>\n    <div class=\"inner\">\n      <label class=\"chk\"><input type=\"checkbox\" id=\"thick\"><span>Thicker walls<small>Fewer see-through gaps, but more blocks.<\/small><\/span><\/label>\n      <div class=\"field\"><label for=\"dv\">Data version<\/label><input type=\"number\" id=\"dv\" value=\"3955\"><span class=\"hint\">3955 is Minecraft 1.21.1. Newer versions upgrade it automatically.<\/span><\/div>\n      <div class=\"field\"><label for=\"jar\">Minecraft jar (optional)<\/label><input class=\"plain\" type=\"file\" id=\"jar\" accept=\".jar,.zip\"><span class=\"hint\">Gives exact block colors. Needs an internet connection once to load the zip library.<\/span><\/div>\n      <p class=\"sub-h\">Color resource pack<\/p>\n      <div class=\"g alue=\"all\">Concrete powder, sand, red sand, gravel<\/option><option value=\"cp\">Concrete powder only<\/option><\/select><\/div>\n<div class=\"field\"><label for=\"dith\">Dithering<\/label><select id=\"dith\"><option value=\"0\">Off<\/option><option value=\"1\">Floyd-Steinberg<\/option><\/select><\/div><\/div><\/section>\n<section class=\"step\"><h2><span class=\"n\">3<\/span>Hanging shape<\/h2><div class=\"stack\">\n<div class=\"field\"><label for=\"mode\">Shape<\/label><select id=\"mode\"><option value=\"bfs\">Cone (low and wide, like the V shape)<\/option><option value=\"dfs\">Twisty tower (tall, like the snake)<\/option><option value=\"tw\">Cone twist (4 cones climbing, one torch)<\/option><\/select><\/div>\n<div class=\"grid2\"><div class=\"field\"><label for=\"cap\">Max height (twisty)<\/label><input type=\"number\" id=\"cap\" min=\"5\" max=\"300\" value=\"120\"><\/div><div class=\"field\"><label for=\"seed\">Random seed<\/label><input type=\"number\" id=\"seed\" value=\"1\"><\/div><\/div>\n<span class=\"hint\">Every block is held up by a torch stuck on the side of its neighbour, one level lower. Break the start torch and the whole thing collapses in a chain.<\/span><\/div><\/section>\n<section class=\"step\"><h2><span class=\"n\">4<\/span>Export<\/h2><div class=\"stack\"><div class=\"grid2\"><div class=\"field\"><label for=\"fmt\">Format<\/label><select id=\"fmt\"><option value=\"schem\">.schem (Axiom, WorldEdit)<\/option><option value=\"litematic\">.litematic (Litematica)<\/option><\/select><\/div><div class=\"field\"><label for=\"dv\">Data version<\/label><input type=\"number\" id=\"dv\" value=\"3955\"><\/div><\/div><div class=\"field\"><label for=\"pf\">Resource pack format<\/label><input type=\"number\" id=\"pf\" value=\"75\"><span class=\"hint\">75 is 1.21.11, 69 is 1.21.9 to 1.21.10, 34 is 1.21.1. Only 19 blocks fall, so the pack gives at most 19 exact colors.<\/span><\/div><\/div><\/section>\n<\/div><div class=\"side-foot\"><div id=\"status\">Choose an image to begin.<\/div><button class=\"btn primary\" id=\"go\" disabled>Generate<\/button><button class=\"btn solid\" id=\"dl\" disabled>Export schematic<\/button><button class=\"btn\" id=\"dlPack\" disabled>Export with color pack<\/button><\/div><\/aside>\n<main class=\"stage\">\n<div class=\"panel\" id=\"p1\" style=\"display:none\"><div class=\"bar\"><b>Final picture (after it falls)<\/b><label class=\"chk spacer\"><input type=\"checkbox\" id=\"texchk\" checked> Real block textures<\/label><label class=\"chk\"><input type=\"checkbox\" id=\"orig\"> Show original image colors<\/label><\/div>\n<div class=\"texnote\" id=\"texnote\"><span>Showing approximate block textures. Load your Minecraft jar to see the real ones (remembered next time).<\/span><label class=\"btn sm\">Load Minecraft jar<input type=\"file\" id=\"texjar\" accept=\".jar,.zip\" hidden><\/label><\/div><div class=\"preview-box\" style=\"min-height:120px\"><canvas id=\"flat\" style=\"image-rendering:pixelated\"><\/canvas><\/div><\/div>\n<div class=\"panel\" id=\"p2\" style=\"display:none\"><div class=\"bar\"><b>Hanging tower (before it falls)<\/b><\/div><div class=\"caption\" id=\"info\"><\/div><div class=\"preview-box\"><canvas id=\"iso\"><\/canvas><\/div><div class=\"foot-note\">Paste the schematic on flat ground (bottom layer = ground level + 1). Mine the single torch standing on the ground to start the collapse.<\/div><\/div>\n<div class=\"empty\" id=\"empty\"><h2>Your preview appears here<\/h2><p>Add an image, then press Generate.<\/p><\/div>\n<\/main><\/div>\n<script>\n\"use strict\";\n/*MCTEX*/\nconst $=id=>document.getElementById(id), st=s=>$(\"status\").textContent=s, tick=()=>new Promise(r=>setTimeout(r));\nconst CN=[\"white\",\"orange\",\"magenta\",\"light_blue\",\"yellow\",\"lime\",\"pink\",\"gray\",\"light_gray\",\"cyan\",\"purple\",\"blue\",\"brown\",\"green\",\"red\",\"black\"];\nconst CP=[[226,227,228],[227,131,31],[192,83,184],[74,180,213],[232,199,54],[125,189,41],[228,153,181],[76,81,
